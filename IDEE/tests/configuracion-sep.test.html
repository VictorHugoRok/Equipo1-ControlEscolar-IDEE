<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests — configuracion-sep.js</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8f9fa; color: #212529; padding: 2rem; }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.25rem; }
        .subtitle { color: #6c757d; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .summary { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .badge { padding: 0.5rem 1.2rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
        .badge-total { background: #e9ecef; color: #495057; }
        .badge-pass  { background: #d1e7dd; color: #0f5132; }
        .badge-fail  { background: #f8d7da; color: #842029; }
        .result-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .result-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem;
                       border-radius: 8px; border: 1px solid transparent; font-size: 0.92rem; }
        .result-item.pass { background: #f0fdf4; border-color: #bbf7d0; }
        .result-item.fail { background: #fff1f2; border-color: #fecdd3; }
        .icon  { font-size: 1rem; flex-shrink: 0; margin-top: 0.05rem; }
        .test-name { font-weight: 600; }
        .test-desc { color: #6c757d; font-size: 0.84rem; margin-top: 0.15rem; }
        .error-msg { color: #dc2626; font-size: 0.82rem; font-family: monospace;
                     background: #fee2e2; padding: 0.25rem 0.5rem; border-radius: 4px; margin-top: 0.35rem; }
        .section-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
                         color: #6c757d; text-transform: uppercase; margin: 1.25rem 0 0.5rem; }
        .progress { height: 6px; background: #e9ecef; border-radius: 3px; margin-bottom: 1.5rem; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .report-footer { margin-top: 1.5rem; color: #adb5bd; font-size: 0.8rem; text-align: right; }
    </style>

    <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  MOCKS — definidos antes de cargar los scripts           ║
    ╚══════════════════════════════════════════════════════════╝
    -->
    <script>
        // config.js
        const API_BASE_URL = 'http://localhost:8080/api';

        // Bootstrap stub
        const bootstrap = {
            Modal: class {
                constructor(el) { this._el = el; }
                show() {}
                hide() {}
                static getInstance(el) { return { hide: () => {} }; }
            }
        };

        // localStorage stub (sobre el real del navegador)
        const _storage = {};
        const _origStorage = window.localStorage;
        Object.defineProperty(window, 'localStorage', {
            value: {
                getItem:    k => (k in _storage ? _storage[k] : null),
                setItem:    (k, v) => { _storage[k] = v; },
                removeItem: k => { delete _storage[k]; }
            },
            configurable: true
        });

        // auth.js stubs
        function protectPage() {}
        function logout() {}

        // fetch stub — se sobreescribe por test
        let _fetchMock = null;
        window.fetch = async (url, options) => {
            if (_fetchMock) return _fetchMock(url, options);
            return { ok: true, status: 200, json: async () => ({}) };
        };
    </script>
</head>
<body>

    <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  DOM MÍNIMO — reproduce la estructura de               ║
    ║  configuracion-sep.html sin la nav ni los tabs          ║
    ╚══════════════════════════════════════════════════════════╝
    -->

    <!-- Banner de estado (FE-09, FE-10) -->
    <div id="estadoConfiguracion" class="d-none" style="display:none"></div>

    <!-- Navbar parcial -->
    <span id="navUserEmail"></span>

    <!-- Formulario institución (FE-01, FE-02) -->
    <form id="formInstitucion" style="display:none">
        <input id="institucionId">
        <input id="cveInstitucion">
        <input id="nombreInstitucion">
        <input id="idEntidadFederativa">
        <input id="entidadFederativa">
        <input id="noCertificadoSat">
        <button type="button" id="btnCancelarInstitucion"></button>
        <button id="btnCerrarSesion"></button>
    </form>
    <div id="alertaInstitucion" class="d-none"></div>

    <!-- Tabla responsables (FE-03, FE-04) -->
    <table style="display:none"><tbody id="tablaResponsables"></tbody></table>

    <!-- Modal responsable (FE-05 helpers) -->
    <div id="modalResponsable" style="display:none">
        <div id="modalResponsableTitle"></div>
        <form id="formResponsable">
            <input id="responsableId">
            <input id="responsableNombre">
            <input id="responsablePrimerApellido">
            <input id="responsableSegundoApellido">
            <input id="responsableCurp">
            <input id="responsableIdCargo">
            <input id="responsableCargo">
            <input id="responsableAbrTitulo">
            <input id="responsableOrdenFirma" type="number" value="1">
            <input id="responsableActivo" type="checkbox" checked>
        </form>
        <div id="alertaResponsable" class="d-none"></div>
        <button id="btnGuardarResponsable"></button>
    </div>

    <!-- Formulario certificados (FE-05 a FE-08) -->
    <form id="formCertificados" style="display:none">
        <input id="certificadoFile"  type="file">
        <input id="llavePrivadaFile" type="file">
        <input id="passwordLlave"    type="password">
        <div id="certificadoStatus"></div>
        <div id="llaveStatus"></div>
        <button type="submit">Cargar</button>
    </form>
    <div id="alertaCertificados" class="d-none"></div>

    <!-- Cargar el script bajo prueba -->
    <script src="../js/configuracion-sep.js"></script>

    <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  SUITE DE TESTS                                          ║
    ╚══════════════════════════════════════════════════════════╝
    -->
    <script>
    (function () {
        // ── Mini runner ───────────────────────────────────────────
        const suite = [];

        function test(grupo, nombre, descripcion, fn) {
            try {
                fn();
                suite.push({ ok: true, grupo, nombre, descripcion });
            } catch (e) {
                suite.push({ ok: false, grupo, nombre, descripcion, error: e.message });
            }
        }

        async function testAsync(grupo, nombre, descripcion, fn) {
            try {
                await fn();
                suite.push({ ok: true, grupo, nombre, descripcion });
            } catch (e) {
                suite.push({ ok: false, grupo, nombre, descripcion, error: e.message });
            }
        }

        function assert(cond, msg) {
            if (!cond) throw new Error(msg || 'Aserción falló');
        }

        function resetAlerta(id) {
            const el = document.getElementById(id);
            if (el) { el.className = 'd-none'; el.textContent = ''; }
        }

        // ════════════════════════════════════════════════════════
        // GRUPO 1 — mostrarConfiguracionEnFormulario (FE-01, FE-02)
        // ════════════════════════════════════════════════════════

        test(
            'mostrarConfiguracionEnFormulario',
            'FE-01',
            'Rellena todos los campos del formulario con los valores del objeto config',
            () => {
                mostrarConfiguracionEnFormulario({
                    id: 42,
                    cveInstitucion:     'IDEE001',
                    nombreInstitucion:  'Instituto IDEE',
                    idEntidadFederativa:'09',
                    entidadFederativa:  'Ciudad de México',
                    noCertificadoSat:   '20001000000300022816'
                });

                assert(document.getElementById('institucionId').value === '42',
                    'institucionId debería ser "42"');
                assert(document.getElementById('cveInstitucion').value === 'IDEE001',
                    'cveInstitucion debería ser "IDEE001"');
                assert(document.getElementById('nombreInstitucion').value === 'Instituto IDEE',
                    'nombreInstitucion incorrecto');
                assert(document.getElementById('idEntidadFederativa').value === '09',
                    'idEntidadFederativa debería ser "09"');
                assert(document.getElementById('entidadFederativa').value === 'Ciudad de México',
                    'entidadFederativa incorrecto');
                assert(document.getElementById('noCertificadoSat').value === '20001000000300022816',
                    'noCertificadoSat incorrecto');
            }
        );

        test(
            'mostrarConfiguracionEnFormulario',
            'FE-02',
            'Campos opcionales ausentes quedan vacíos, no muestran "undefined" ni "null"',
            () => {
                mostrarConfiguracionEnFormulario({
                    id: 1,
                    cveInstitucion:     'TEST',
                    nombreInstitucion:  'Test',
                    idEntidadFederativa:'01',
                    entidadFederativa:  'Aguascalientes'
                    // noCertificadoSat ausente
                });

                const val = document.getElementById('noCertificadoSat').value;
                assert(val !== 'undefined' && val !== 'null',
                    `noCertificadoSat no debería mostrar "${val}" cuando es undefined`);
            }
        );

        // ════════════════════════════════════════════════════════
        // GRUPO 2 — mostrarResponsablesEnTabla (FE-03, FE-04)
        // ════════════════════════════════════════════════════════

        test(
            'mostrarResponsablesEnTabla',
            'FE-03',
            'Genera una fila por responsable con el badge de estado correcto',
            () => {
                const responsables = [
                    { id: 1, ordenFirma: 1, nombre: 'Ana', primerApellido: 'Martínez',
                      segundoApellido: 'López', curp: 'MALA900101MDFRRSA01',
                      cargo: 'Directora General', abrTitulo: 'Dra.', activo: true },
                    { id: 2, ordenFirma: 2, nombre: 'Carlos', primerApellido: 'Pérez',
                      segundoApellido: null, curp: 'PECC850202HDFRRRCA02',
                      cargo: 'Secretario Académico', abrTitulo: null, activo: false }
                ];

                mostrarResponsablesEnTabla(responsables);

                const tbody = document.getElementById('tablaResponsables');
                const filas = tbody.querySelectorAll('tr');
                assert(filas.length === 2, `Se esperaban 2 filas, hay ${filas.length}`);

                const html = tbody.innerHTML;
                assert(html.includes('Ana'), 'Fila 1: nombre "Ana" no aparece');
                assert(html.includes('Directora General'), 'Fila 1: cargo no aparece');
                assert(html.includes('bg-success'), 'Fila 1 activo=true debería tener badge bg-success');
                assert(html.includes('bg-secondary'), 'Fila 2 activo=false debería tener badge bg-secondary');
                assert(html.includes('Dra.'), 'Fila 1: abrTitulo "Dra." no aparece');
                assert(html.includes('-'), 'Fila 2 sin abrTitulo debería mostrar "-"');
            }
        );

        test(
            'mostrarResponsablesEnTabla',
            'FE-04',
            'Lista vacía muestra mensaje "No hay responsables" sin filas de datos',
            () => {
                mostrarResponsablesEnTabla([]);

                const tbody = document.getElementById('tablaResponsables');
                const filas = tbody.querySelectorAll('tr');
                assert(filas.length === 1, `Se esperaba 1 fila de mensaje, hay ${filas.length}`);
                assert(tbody.innerHTML.toLowerCase().includes('no hay'),
                    'Debería mostrar mensaje "No hay responsables..."');
            }
        );

        // ════════════════════════════════════════════════════════
        // GRUPO 3 — guardarCertificados: validaciones (FE-05 a FE-08)
        // ════════════════════════════════════════════════════════

        test(
            'guardarCertificados — validaciones',
            'FE-05',
            'Sin configuración activa muestra alerta warning y no hace fetch',
            () => {
                // Sin configuración activa
                configuracionActual = null;
                resetAlerta('alertaCertificados');

                let fetchLlamado = false;
                _fetchMock = () => { fetchLlamado = true; return Promise.resolve({ ok: true }); };

                // Simular submit
                const form = document.getElementById('formCertificados');
                const event = { preventDefault: () => {}, target: form };
                guardarCertificados(event);

                const alerta = document.getElementById('alertaCertificados');
                assert(!alerta.classList.contains('d-none'),
                    'La alerta debería ser visible');
                assert(alerta.className.includes('warning'),
                    `La alerta debería ser de tipo warning, es: ${alerta.className}`);
                assert(!fetchLlamado,
                    'No debería haberse llamado a fetch sin configuración activa');

                _fetchMock = null;
            }
        );

        test(
            'guardarCertificados — validaciones',
            'FE-06',
            'Sin archivo .cer seleccionado muestra alerta warning',
            () => {
                configuracionActual = { id: 1 };
                resetAlerta('alertaCertificados');

                // Sin archivos en los inputs (FileList vacía por defecto)
                const form = document.getElementById('formCertificados');
                const event = { preventDefault: () => {}, target: form };

                let fetchLlamado = false;
                _fetchMock = () => { fetchLlamado = true; return Promise.resolve({ ok: true }); };

                guardarCertificados(event);

                const alerta = document.getElementById('alertaCertificados');
                assert(!alerta.classList.contains('d-none'),
                    'La alerta debería ser visible');
                assert(!fetchLlamado, 'No debería haberse llamado a fetch sin archivo .cer');

                _fetchMock = null;
                configuracionActual = null;
            }
        );

        test(
            'guardarCertificados — validaciones',
            'FE-07',
            'Archivo con extensión incorrecta en campo .cer muestra alerta danger',
            () => {
                configuracionActual = { id: 1 };
                resetAlerta('alertaCertificados');

                // Mockear FileList con archivo de extensión incorrecta
                const archivoInvalido = { name: 'documento.pdf', size: 1024 };
                const fileInputCer = document.getElementById('certificadoFile');
                Object.defineProperty(fileInputCer, 'files', {
                    value: [archivoInvalido], configurable: true
                });
                const fileInputKey = document.getElementById('llavePrivadaFile');
                Object.defineProperty(fileInputKey, 'files', {
                    value: [{ name: 'llave.key', size: 512 }], configurable: true
                });
                document.getElementById('passwordLlave').value = 'pass123';

                let fetchLlamado = false;
                _fetchMock = () => { fetchLlamado = true; return Promise.resolve({ ok: true }); };

                const form = document.getElementById('formCertificados');
                const event = { preventDefault: () => {}, target: form };
                guardarCertificados(event);

                const alerta = document.getElementById('alertaCertificados');
                assert(!alerta.classList.contains('d-none'),
                    'La alerta debería ser visible');
                assert(alerta.className.includes('danger'),
                    `La alerta debería ser de tipo danger, es: ${alerta.className}`);
                assert(!fetchLlamado,
                    'No debería haberse llamado a fetch con extensión incorrecta');

                _fetchMock = null;
                configuracionActual = null;
                // Limpiar
                Object.defineProperty(fileInputCer, 'files', { value: [], configurable: true });
                Object.defineProperty(fileInputKey, 'files', { value: [], configurable: true });
                document.getElementById('passwordLlave').value = '';
            }
        );

        test(
            'guardarCertificados — validaciones',
            'FE-08',
            'Password vacío con archivos válidos muestra alerta warning y no hace fetch',
            () => {
                configuracionActual = { id: 1 };
                resetAlerta('alertaCertificados');

                const fileInputCer = document.getElementById('certificadoFile');
                Object.defineProperty(fileInputCer, 'files', {
                    value: [{ name: 'cert.cer', size: 1024 }], configurable: true
                });
                const fileInputKey = document.getElementById('llavePrivadaFile');
                Object.defineProperty(fileInputKey, 'files', {
                    value: [{ name: 'llave.key', size: 512 }], configurable: true
                });
                document.getElementById('passwordLlave').value = ''; // vacío

                let fetchLlamado = false;
                _fetchMock = () => { fetchLlamado = true; return Promise.resolve({ ok: true }); };

                const form = document.getElementById('formCertificados');
                const event = { preventDefault: () => {}, target: form };
                guardarCertificados(event);

                const alerta = document.getElementById('alertaCertificados');
                assert(!alerta.classList.contains('d-none'),
                    'La alerta debería ser visible');
                assert(!fetchLlamado,
                    'No debería haberse llamado a fetch sin password');

                _fetchMock = null;
                configuracionActual = null;
                Object.defineProperty(fileInputCer, 'files', { value: [], configurable: true });
                Object.defineProperty(fileInputKey, 'files', { value: [], configurable: true });
            }
        );

        // ════════════════════════════════════════════════════════
        // GRUPO 4 — guardarResponsable: validación CURP (FE-09)
        // ════════════════════════════════════════════════════════

        test(
            'guardarResponsable — validaciones',
            'FE-09',
            'CURP con menos de 18 caracteres muestra alerta danger y no hace fetch',
            () => {
                resetAlerta('alertaResponsable');

                document.getElementById('responsableId').value = '';
                document.getElementById('responsableNombre').value = 'Test';
                document.getElementById('responsablePrimerApellido').value = 'User';
                document.getElementById('responsableSegundoApellido').value = '';
                document.getElementById('responsableCurp').value = 'ABC123'; // solo 6 chars
                document.getElementById('responsableIdCargo').value = '01';
                document.getElementById('responsableCargo').value = 'Director';
                document.getElementById('responsableAbrTitulo').value = '';
                document.getElementById('responsableOrdenFirma').value = '1';
                document.getElementById('responsableActivo').checked = true;

                let fetchLlamado = false;
                _fetchMock = () => { fetchLlamado = true; return Promise.resolve({ ok: true }); };

                guardarResponsable();

                const alerta = document.getElementById('alertaResponsable');
                assert(!alerta.classList.contains('d-none'),
                    'La alerta debería ser visible');
                assert(alerta.className.includes('danger'),
                    `La alerta debería ser de tipo danger, es: ${alerta.className}`);
                assert(!fetchLlamado,
                    'No debería haberse llamado a fetch con CURP inválido');

                _fetchMock = null;
            }
        );

        // ════════════════════════════════════════════════════════
        // GRUPO 5 — mostrarAlertaEstado / ocultarAlertaEstado (FE-10)
        // ════════════════════════════════════════════════════════

        test(
            'Banner de estado',
            'FE-10',
            'mostrarAlertaEstado quita d-none y ocultarAlertaEstado lo agrega de vuelta',
            () => {
                const banner = document.getElementById('estadoConfiguracion');

                // Asegurar estado inicial oculto
                banner.classList.add('d-none');
                assert(banner.classList.contains('d-none'), 'Precondición: banner debe estar oculto');

                mostrarAlertaEstado();
                assert(!banner.classList.contains('d-none'),
                    'Tras mostrarAlertaEstado el banner NO debería tener clase d-none');

                ocultarAlertaEstado();
                assert(banner.classList.contains('d-none'),
                    'Tras ocultarAlertaEstado el banner debería tener clase d-none de nuevo');
            }
        );

        // ════════════════════════════════════════════════════════
        // RENDER ASÍNCRONO
        // ════════════════════════════════════════════════════════
        setTimeout(() => {
            const total   = suite.length;
            const pasados = suite.filter(t => t.ok).length;
            const fallidos = total - pasados;
            const pct = total ? Math.round((pasados / total) * 100) : 0;
            const grupos = [...new Set(suite.map(t => t.grupo))];

            document.body.innerHTML += `
                <h1>Reporte de Tests — configuracion-sep.js</h1>
                <p class="subtitle">
                    Valida las funciones de <strong>Configuración Institucional</strong>,
                    <strong>Responsables de Firma</strong> y <strong>Certificados SAT</strong>
                    de la página de configuración para títulos electrónicos.
                </p>

                <div class="summary">
                    <span class="badge badge-total">Total: ${total}</span>
                    <span class="badge badge-pass">✓ Pasados: ${pasados}</span>
                    ${fallidos > 0 ? `<span class="badge badge-fail">✗ Fallidos: ${fallidos}</span>` : ''}
                </div>

                <div class="progress">
                    <div class="progress-bar"
                         style="width:${pct}%; background:${fallidos === 0 ? '#22c55e' : '#ef4444'}">
                    </div>
                </div>

                <div class="result-list">
                    ${grupos.map(grupo => `
                        <div class="section-title">${grupo}</div>
                        ${suite.filter(t => t.grupo === grupo).map(t => `
                            <div class="result-item ${t.ok ? 'pass' : 'fail'}">
                                <span class="icon">${t.ok ? '✅' : '❌'}</span>
                                <div>
                                    <div class="test-name">${t.nombre} — ${t.ok ? 'PASÓ' : 'FALLÓ'}</div>
                                    <div class="test-desc">${t.descripcion}</div>
                                    ${t.error ? `<div class="error-msg">${t.error}</div>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    `).join('')}
                </div>

                <div class="report-footer">
                    Ejecutado el ${new Date().toLocaleString('es-MX')} &nbsp;·&nbsp;
                    ${pct}% de cobertura aprobada
                </div>
            `;

            console.group('%c Tests configuracion-sep.js ', 'background:#7c3aed;color:#fff;padding:2px 6px;border-radius:4px');
            suite.forEach(t => {
                const style = t.ok ? 'color:green' : 'color:red;font-weight:bold';
                console.log(`%c${t.ok ? '✅' : '❌'} ${t.nombre}: ${t.descripcion}`, style);
                if (t.error) console.error('   →', t.error);
            });
            console.log(`\nResultado: ${pasados}/${total} tests pasaron`);
            console.groupEnd();
        }, 100);

    })();
    </script>
</body>
</html>
