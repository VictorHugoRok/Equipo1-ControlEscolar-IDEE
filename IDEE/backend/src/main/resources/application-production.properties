# ===============================
# DATABASE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# APP
# ===============================
app.permission-check.enabled=true
app.allow-init-usuarios=false

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
server.forward-headers-strategy=framework

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# LOGS
# ===============================
logging.file.name=${LOGGING_FILE_NAME:/var/log/idee/app.log}
logging.level.com.idee.controlescolar=INFO
logging.level.org.springframework.security=WARN

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=250MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
