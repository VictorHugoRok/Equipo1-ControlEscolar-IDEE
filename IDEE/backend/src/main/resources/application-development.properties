# ===============================
# PERFIL development
# ===============================
# Puerto ocupado: $env:PORT=8081 (PowerShell) antes de mvn spring-boot:run
# Ejecutar el backend desde backend/ para que spring-dotenv cargue .env

app.permission-check.enabled=false
app.allow-init-usuarios=true

# Si defines SPRING_DATASOURCE_URL en .env → PostgreSQL. Si no → H2 en memoria.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# El dialecto lo elige Hibernate según la URL JDBC (H2 vs PostgreSQL).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DEV: permitir arrancar aunque haya migraciones antiguas no presentes localmente.
# Esto evita bloqueo por validación de Flyway en entornos donde ya se aplicó una migración eliminada.
spring.flyway.validate-on-migrate=false

# DEV: en BD vacía se deben ejecutar TODAS las migraciones desde V3.
# baseline-version=29 (default en application.properties) es para producción, donde la BD ya
# existía antes de introducir Flyway. En local nunca queremos saltarnos migraciones.
spring.flyway.baseline-version=0

logging.level.com.idee.controlescolar=DEBUG
logging.level.org.springframework.security=DEBUG
