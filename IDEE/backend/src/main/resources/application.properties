# ===================================================================
# Configuración base (sin credenciales en texto plano).
# Secretos: SPRING_DATASOURCE_*, JWT_SECRET, etc. vía variables de entorno
# o archivo backend/.env (spring-dotenv, solo desarrollo local).
# ===================================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# JWT — JWT_SECRET en entorno; si falta en desarrollo, JwtUtil usa un default solo en código.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS (frontend). En servidor: CORS_ORIGINS=https://tudominio.com
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

spring.servlet.multipart.max-file-size=30MB
# Varias cédulas + documentos básicos en un solo PUT/POST: subir piso y techo
spring.servlet.multipart.max-request-size=250MB

logging.level.com.idee.controlescolar=INFO

# --- Flyway ---
# baseline-on-migrate: si no existe flyway_schema_history, Flyway crea la tabla y registra un baseline
# en lugar de fallar. Útil para BDs que existían antes de introducir Flyway.
# ADVERTENCIA: baseline-version=29 salta V1..V29 aunque la BD esté vacía. Solo usar en producción
# donde esas tablas ya existen. En local dev se sobreescribe a 0 en application-development.properties.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:29}
