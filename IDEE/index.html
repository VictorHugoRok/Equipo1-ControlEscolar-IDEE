<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>IDEE - Acceso alumnos y maestros</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- CSS general -->
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="login-wrapper">


    <div class="login-wrapper">
      <div class="card card-login shadow-lg">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <img src="assets/logo.png" class="login-logo" alt="IDEE logo" />
          </div>

          <h5 class="mb-3 text-center fw-bold text-primary-ide">Acceso alumnos y maestros</h5>

          <p class="text-muted small text-center mb-4">
            Portal de consulta académica, horarios, asignaturas y evaluación docente.
          </p>

          <form id="userLoginForm">
            <div id="loginFeedback" class="alert d-none" role="alert"></div>
            <div class="mb-3">
              <label class="form-label">Correo institucional</label>
              <input type="email" class="form-control" id="userEmail"
                placeholder="alumno@idee.edu.mx / maestro@idee.edu.mx" required />
            </div>

            <div class="mb-2 position-relative">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="userPassword" placeholder="••••••••" required />
              <button type="button" class="toggle-password" onclick="togglePassword()">
                👁
              </button>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check small">
                <input class="form-check-input" type="checkbox" id="rememberCheck" />
                <label class="form-check-label" for="rememberCheck">
                  Mantener sesión
                </label>
              </div>

              <a href="#" class="small link-ide text-decoration-none">
                No recuerdo mi contraseña
              </a>
            </div>

            <button type="submit" class="btn btn-ide w-100 py-2">
              Ingresar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Mostrar aviso si ya hay sesión activa (sin redirigir automáticamente para evitar bucles)
    document.addEventListener('DOMContentLoaded', function () {
      if (isAuthenticated()) {
        const userTipo = localStorage.getItem('userTipo');
        const userEmail = localStorage.getItem('userEmail');
        if (userTipo) {
          const feedback = document.getElementById('loginFeedback');
          feedback.className = 'alert alert-info';
          feedback.innerHTML =
            'Ya tienes una sesión activa como <strong>' + userEmail + '</strong>. ' +
            '<a href="#" id="linkIrAlSistema" class="alert-link">Ir al sistema</a> ' +
            'o inicia sesión con otra cuenta abajo.';
          feedback.classList.remove('d-none');
          document.getElementById('linkIrAlSistema').addEventListener('click', function (e) {
            e.preventDefault();
            redirectByUserType(userTipo);
          });
        } else {
          logout();
        }
      }
    });

    // Manejar el formulario de login
    document.getElementById("userLoginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("userEmail").value.trim();
      const password = document.getElementById("userPassword").value.trim();
      const submitBtn = document.querySelector('button[type="submit"]');
      const feedback = document.getElementById('loginFeedback');

      // Validar que ambos campos estén llenos
      if (!email || !password) {
        mostrarLoginFeedback('Por favor ingresa email y contraseña', 'warning');
        return;
      }

      // Deshabilitar el botón mientras se procesa
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Ingresando...';
      feedback.classList.add('d-none');

      try {
        console.log('🔐 Iniciando login para:', email);
        const data = await login(email, password); // Usa la función de auth.js
        console.log('✅ Login exitoso, datos recibidos:', data);
        console.log('💾 Token en localStorage:', localStorage.getItem('token'));

        mostrarLoginFeedback(`🎉 ¡Bienvenido ${data.email}!`, 'success');

        setTimeout(() => {
          console.log('📍 Redirigiendo a:', data.tipoUsuario);
          redirectByUserType(data.tipoUsuario);
        }, 800);

      } catch (error) {
        console.error('❌ Error en login:', error.message);
        console.error('📋 Respuesta del servidor completa:', error);
        
        // Limpiar cualquier dato residual de intentos fallidos
        console.warn('🗑️ Limpiando datos residuales de localStorage');
        localStorage.removeItem('token');
        localStorage.removeItem('userTipo');
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userId');

        let mensajeError = error.message || 'Credenciales incorrectas';
        if (error.message.includes('Usuario no encontrado')) {
          mensajeError = '❌ Usuario no registrado en el sistema';
        } else if (error.message.includes('Credenciales incorrectas') || error.message.includes('Access Denied')) {
          mensajeError = '❌ Email o contraseña incorrectos';
        } else if (error.message.includes('Usuario inactivo')) {
          mensajeError = '❌ Usuario inactivo. Contacta con administración';
        } else if (error.message.includes('403')) {
          mensajeError = '❌ Acceso denegado. Verifica tus credenciales o contacta a administración';
        }

        mostrarLoginFeedback(mensajeError, 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });

    // Función para mostrar/ocultar contraseña
    function togglePassword() {
      const passwordInput = document.getElementById('userPassword');
      const toggleBtn = document.querySelector('.toggle-password');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁';
      }
    }

    function mostrarLoginFeedback(mensaje, tipo) {
      const feedback = document.getElementById('loginFeedback');
      if (!feedback) return;

      feedback.textContent = mensaje;
      feedback.className = `alert alert-${tipo}`;
      feedback.classList.remove('d-none');
    }
  </script>

</body>

</html>
