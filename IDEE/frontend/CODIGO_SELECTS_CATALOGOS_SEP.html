<!--
═══════════════════════════════════════════════════════════════════════════════
JAVASCRIPT PARA SINCRONIZAR SELECTS
═══════════════════════════════════════════════════════════════════════════════
-->

<script>
/**
 * Función genérica para sincronizar selects con hidden inputs
 * @param {string} selectId - ID del select
 * @param {string} idHiddenId - ID del input hidden para el ID
 * @param {string} textoHiddenId - ID del input hidden para el texto
 */
function sincronizarSelect(selectId, idHiddenId, textoHiddenId) {
    const select = document.getElementById(selectId);
    if (!select) return;

    select.addEventListener('change', function() {
        const valor = this.value;
        if (valor) {
            const [id, texto] = valor.split('|');
            document.getElementById(idHiddenId).value = id;
            document.getElementById(textoHiddenId).value = texto;
        } else {
            document.getElementById(idHiddenId).value = '';
            document.getElementById(textoHiddenId).value = '';
        }
    });

    // Trigger inicial si hay valor seleccionado
    if (select.value) {
        select.dispatchEvent(new Event('change'));
    }
}

// Inicializar todos los selects al cargar la página
document.addEventListener('DOMContentLoaded', function() {
    // 1. Cargo del firmante
    sincronizarSelect('responsableIdCargo', 'responsableIdCargoValue', 'responsableCargoTexto');

    // 2. Autorización/Reconocimiento
    sincronizarSelect('autorizacionReconocimiento', 'idAutorizacionReconocimiento', 'autorizacionReconocimientoTexto');

    // 3. Fundamento Legal Servicio Social
    sincronizarSelect('fundamentoLegalServicioSocial', 'idFundamentoLegalServicioSocial', 'fundamentoLegalServicioSocialTexto');

    // 4. Modalidad de Titulación
    sincronizarSelect('modalidadTitulacion', 'idModalidadTitulacion', 'modalidadTitulacionTexto');

    // 5. Entidad Federativa (Expedición)
    sincronizarSelect('entidadFederativa', 'idEntidadFederativa', 'entidadFederativaTexto');

    // 6. Tipo de Estudio Antecedente
    sincronizarSelect('tipoEstudioAntecedente', 'idTipoEstudioAntecedente', 'tipoEstudioAntecedenteTexto');

    // 7. Entidad Federativa (Antecedente)
    sincronizarSelect('entidadFederativaAntecedente', 'idEntidadFederativaAntecedente', 'entidadFederativaAntecedenteTexto');
});


/**
 * EJEMPLO DE USO EN EL FORMULARIO DE GENERACIÓN DE TÍTULO
 */
async function generarTitulo(event) {
    event.preventDefault();

    const datos = {
        alumnoId: parseInt(document.getElementById('alumnoId').value),
        programaId: parseInt(document.getElementById('programaId').value),
        fechaExpedicion: document.getElementById('fechaExpedicion').value,

        // Usar los valores hidden (ID y Texto separados)
        idModalidadTitulacion: document.getElementById('idModalidadTitulacion').value,
        modalidadTitulacion: document.getElementById('modalidadTitulacionTexto').value,

        fechaExamenProfesional: document.getElementById('fechaExamenProfesional').value,
        cumplioServicioSocial: document.getElementById('cumplioServicioSocial').checked,

        idFundamentoLegalServicioSocial: document.getElementById('idFundamentoLegalServicioSocial').value,
        fundamentoLegalServicioSocial: document.getElementById('fundamentoLegalServicioSocialTexto').value,

        institucionProcedencia: document.getElementById('institucionProcedencia').value,

        idTipoEstudioAntecedente: document.getElementById('idTipoEstudioAntecedente').value,
        tipoEstudioAntecedente: document.getElementById('tipoEstudioAntecedenteTexto').value,

        idEntidadFederativaAntecedente: document.getElementById('idEntidadFederativaAntecedente').value,
        entidadFederativaAntecedente: document.getElementById('entidadFederativaAntecedenteTexto').value,

        fechaTerminacionAntecedente: document.getElementById('fechaTerminacionAntecedente').value
    };

    // Enviar al backend
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE_URL}/titulos-electronicos`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        });

        if (response.ok) {
            const resultado = await response.json();
            console.log('Título generado:', resultado);
            alert('¡Título generado exitosamente!');
        } else {
            throw new Error('Error al generar título');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al generar título: ' + error.message);
    }
}


/**
 * EJEMPLO PARA RESPONSABLES DE FIRMA (configuracion-titulos-sep.html)
 */
async function guardarResponsable() {
    const id = document.getElementById('responsableId').value;

    const datos = {
        nombre: document.getElementById('responsableNombre').value.trim(),
        primerApellido: document.getElementById('responsablePrimerApellido').value.trim(),
        segundoApellido: document.getElementById('responsableSegundoApellido').value.trim() || null,
        curp: document.getElementById('responsableCurp').value.trim().toUpperCase(),

        // Usar los valores del select sincronizado
        idCargo: document.getElementById('responsableIdCargoValue').value,
        cargo: document.getElementById('responsableCargoTexto').value,

        abrTitulo: document.getElementById('responsableAbrTitulo').value.trim() || null,
        ordenFirma: parseInt(document.getElementById('responsableOrdenFirma').value),
        activo: document.getElementById('responsableActivo').checked
    };

    // Validar CURP
    if (datos.curp.length !== 18) {
        alert('El CURP debe tener 18 caracteres');
        return;
    }

    try {
        const token = localStorage.getItem('token');
        const url = id ? `${API_BASE_URL}/responsables-firma/${id}` : `${API_BASE_URL}/responsables-firma`;
        const method = id ? 'PUT' : 'POST';

        const response = await fetch(url, {
            method: method,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        });

        if (response.ok) {
            alert('Responsable guardado exitosamente');
            // Recargar tabla o cerrar modal
        } else {
            throw new Error('Error al guardar responsable');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error al guardar el responsable: ' + error.message);
    }
}
</script>
