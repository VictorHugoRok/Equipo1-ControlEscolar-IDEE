<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>IDEE Virtual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>

  <div class="login-wrapper">
    <div class="card card-login shadow-lg">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <img src="assets/logo.png" class="login-logo" alt="IDEE logo" />
        </div>

        <h5 class="mb-2 text-center fw-bold text-primary-ide">
          IDEE Virtual
        </h5>

        <p class="text-muted small text-center mb-4">
          Sistema de consultas y control escolar
        </p>

        <form id="userLoginForm" novalidate onsubmit="return false;" action="javascript:void(0)">
          <div id="loginFeedback" class="alert d-none" role="alert"></div>

          <div class="mb-3">
            <label class="form-label login-field-label" for="userEmail">Correo</label>
            <input
              type="email"
              class="form-control"
              id="userEmail"
              placeholder="nombre@institución.edu.mx"
              autocomplete="username"
              required
            />
          </div>

          <div class="mb-2">
            <label class="form-label login-field-label" for="userPassword">Contraseña</label>
            <div class="password-field-wrap">
              <input
                type="password"
                class="form-control"
                id="userPassword"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
                aria-label="Mostrar u ocultar contraseña"
              >
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="text-end mb-3">
            <a href="javascript:void(0)" class="small link-ide text-decoration-none" id="linkForgotPassword">
              No recuerdo mi contraseña
            </a>
          </div>

          <button type="submit" class="btn btn-ide w-100 py-2" id="btnIngresar">
            Ingresar
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('userPassword');
      const icon = document.querySelector('.toggle-password i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    (function () {
      var forgot = document.getElementById('linkForgotPassword');
      if (forgot) {
        forgot.addEventListener('click', function (e) {
          e.preventDefault();
        });
      }

      if (!(typeof DEV_SKIP_AUTH !== 'undefined' && DEV_SKIP_AUTH) && typeof isAuthenticated === 'function' && isAuthenticated()) {
        if (typeof getCurrentUser === 'function') {
          getCurrentUser().then(function (u) {
            if (typeof redirectByUserType === 'function') {
              var t = (typeof localStorage !== 'undefined' && localStorage.getItem('userTipo'))
                ? localStorage.getItem('userTipo')
                : (u && u.tipoUsuario);
              redirectByUserType(t || (u && u.tipoUsuario) || 'ADMIN');
            }
          }).catch(function () {
            var tipoGuardado = localStorage.getItem('userTipo');
            if (tipoGuardado && typeof redirectByUserType === 'function') {
              redirectByUserType(tipoGuardado);
            }
          });
          return;
        }
        var tipoGuardado = localStorage.getItem('userTipo');
        if (tipoGuardado && typeof redirectByUserType === 'function') {
          redirectByUserType(tipoGuardado);
          return;
        }
      }
      if (typeof resetAuthStateForLoginPage === 'function') resetAuthStateForLoginPage();

      try {
        var notice = sessionStorage.getItem('login_notice');
        if (notice) {
          sessionStorage.removeItem('login_notice');
          if (typeof mostrarLoginFeedback === 'function') {
            mostrarLoginFeedback(notice, 'warning');
          }
        }
      } catch (e) {}

      var form = document.getElementById('userLoginForm');
      var submitBtn = document.getElementById('btnIngresar');
      var loginInProgress = false;

      function doLogin() {
        if (loginInProgress) return;
        var email = document.getElementById('userEmail').value.trim();
        var password = document.getElementById('userPassword').value.trim();

        if (!email || !password) {
          mostrarLoginFeedback('Por favor ingresa email y contraseña', 'warning');
          return;
        }

        loginInProgress = true;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Ingresando...';
        document.getElementById('loginFeedback').classList.add('d-none');

        login(email, password)
          .then(function (data) {
            if (!data || !data.tipoUsuario) {
              mostrarLoginFeedback('Respuesta del servidor incorrecta. Intenta de nuevo.', 'danger');
              submitBtn.disabled = false;
              submitBtn.textContent = 'Ingresar';
              loginInProgress = false;
              return;
            }
            if (!localStorage.getItem('token')) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Ingresar';
              mostrarLoginFeedback('Error al guardar la sesión. Intenta de nuevo.', 'danger');
              loginInProgress = false;
              return;
            }
            mostrarLoginFeedback('¡Bienvenido! Redirigiendo…', 'success');
            setTimeout(function () {
              if (data && data.mustChangePassword && typeof showForcePasswordChangeModal === 'function') {
                showForcePasswordChangeModal({
                  onSuccess: function () {
                    var t = (typeof localStorage !== 'undefined' && localStorage.getItem('userTipo'))
                      ? localStorage.getItem('userTipo')
                      : data.tipoUsuario;
                    redirectByUserType(t || data.tipoUsuario);
                  }
                });
                return;
              }
              var t = (typeof localStorage !== 'undefined' && localStorage.getItem('userTipo'))
                ? localStorage.getItem('userTipo')
                : data.tipoUsuario;
              redirectByUserType(t || data.tipoUsuario);
            }, 300);
          })
          .catch(function (error) {
            loginInProgress = false;
            localStorage.removeItem('token');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('tokenExpiresAt');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userTipo');
            localStorage.removeItem('userId');
            localStorage.removeItem('userRoles');
            localStorage.removeItem('rolActivo');
            localStorage.removeItem('userNombreCompleto');
            var msg = (typeof formatLoginErrorForUser === 'function')
              ? formatLoginErrorForUser(error)
              : ((error && error.message) ? error.message : 'No se pudo iniciar sesión.');
            var tipoAlerta = (error && error.loginHttpStatus === 429) ? 'warning' : 'danger';
            mostrarLoginFeedback(msg, tipoAlerta);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Ingresar';
          });
      }

      var emailInput = document.getElementById('userEmail');
      var passwordInput = document.getElementById('userPassword');

      if (emailInput) {
        emailInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (passwordInput) passwordInput.focus();
          }
        });
      }
      if (passwordInput) {
        passwordInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            doLogin();
          }
        });
      }

      if (submitBtn) submitBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        doLogin();
      });
      if (form) form.addEventListener('submit', function (e) {
        e.preventDefault();
        e.stopPropagation();
        doLogin();
      });

      window.addEventListener('pageshow', function () {
        if (typeof resetAuthStateForLoginPage === 'function') resetAuthStateForLoginPage();
        loginInProgress = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Ingresar';
        }
      });
    })();

    function mostrarLoginFeedback(mensaje, tipo) {
      const feedback = document.getElementById('loginFeedback');
      feedback.textContent = mensaje;
      feedback.className = 'alert alert-' + tipo;
      feedback.classList.remove('d-none');
    }
  </script>

</body>
</html>
