<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Constancias - IDEE Control Escolar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/tablet.css" />
  <link rel="stylesheet" href="../css/mobile.css" />
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="sidebar-container" data-sidebar-src="../components/sidebar.html"></div>
    <main class="dashboard-main">
    <div class="container dashboard-content" id="constanciasSection">
      <h3 class="section-title">Constancias</h3>
      <p class="text-muted">Generación de constancias de estudios.</p>

      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card">
            <div class="card-header bg-soft-primary d-flex align-items-center justify-content-between">
              <span>Seleccionar alumno</span>
              <span class="badge bg-secondary-subtle text-secondary" id="constanciasCount">0</span>
            </div>
            <div class="card-body">
              <div class="input-group mb-2">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="constFiltroAlumno" class="form-control" placeholder="Matrícula, nombre o CURP…" autocomplete="off" />
              </div>
              <div class="row g-2 mb-2">
                <div class="col-12 col-md-7">
                  <select class="form-select form-select-sm" id="constFiltroPrograma" title="Filtrar por programa">
                    <option value="">Todos los programas</option>
                  </select>
                </div>
                <div class="col-12 col-md-5">
                  <select class="form-select form-select-sm" id="constFiltroEstatus" title="Filtrar por estatus">
                    <option value="">Todos</option>
                    <option value="ACTIVA">Activa</option>
                    <option value="BAJA_TEMPORAL">Baja temporal</option>
                    <option value="BAJA_DEFINITIVA">Baja definitiva</option>
                    <option value="EGRESADO">Egresado</option>
                  </select>
                </div>
              </div>

              <div class="kardex-seleccion-lista-scroll border rounded">
                <div id="constListaAlumnos" class="list-group list-group-flush kardex-lista-alumnos">
                  <div class="list-group-item border-0 text-muted small py-4 text-center">Cargando alumnos…</div>
                </div>
              </div>
              <div class="small text-muted mt-2" id="constAlumnoSeleccionadoHint">Selecciona un alumno para continuar.</div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card">
            <div class="card-header bg-soft-primary">Datos de la constancia</div>
            <div class="card-body">
              <div id="constFeedback" class="alert d-none" role="alert"></div>
              <div class="row g-3 align-items-end">
                <div class="col-md-6">
                  <label class="form-label">Tipo de constancia</label>
                  <select class="form-select" id="constTipo">
                    <option value="REGULAR">Regular</option>
                    <option value="CALIFICACIONES">Con calificaciones</option>
                    <option value="EVENTO">Evento / especial</option>
                  </select>
                </div>
                <div class="col-md-6 text-md-end">
                  <button type="button" class="btn btn-primary" id="btnGenerarConstancia" disabled>
                    <i class="bi bi-eye me-1"></i>Vista previa
                  </button>
                </div>
              </div>

              <!-- Host oculto para render a PDF -->
              <div id="constanciaPdfHost" class="d-none"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </main>
  </div>

  <!-- Vista previa de constancia (PDF) -->
  <div class="modal fade" id="modalConstanciaPreview" tabindex="-1" aria-labelledby="modalConstanciaPreviewLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalConstanciaPreviewLabel">Vista previa de constancia</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="ratio" style="--bs-aspect-ratio: 130%;">
            <iframe id="constanciaPreviewFrame" title="Vista previa PDF" style="width:100%;height:100%;border:0;background:#fff;"></iframe>
          </div>
          <div class="small text-muted mt-2" id="constanciaPreviewHint"></div>
        </div>
        <div class="modal-footer flex-wrap gap-2">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Cerrar
          </button>
          <button type="button" class="btn btn-primary" id="btnDescargarConstanciaPdf" disabled>
            <i class="bi bi-download me-1"></i>Descargar PDF
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="../js/load-sidebar.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/roles.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sistema-roles-unified.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/constancias.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof setupLogoutButtons === 'function') setupLogoutButtons();
      if (typeof isAuthenticated === 'function' && !isAuthenticated()) {
        window.location.href = '../index.html';
        return;
      }
      var e = document.getElementById('userEmail');
      if (e) e.textContent = localStorage.getItem('userEmail') || '';
      if (!window.currentUser && localStorage.getItem('userTipo')) {
        window.currentUser = { email: localStorage.getItem('userEmail') || '', tipoUsuario: localStorage.getItem('userTipo'), rol: localStorage.getItem('userTipo') };
      }
      if (typeof aplicarPermisosSegunRol === 'function') aplicarPermisosSegunRol();
      if (typeof validarAccesoModulo === 'function') validarAccesoModulo({ seccion: 'constanciasSection' });
    });
  </script>
</body>
</html>
