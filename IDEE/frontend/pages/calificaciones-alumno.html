<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mis calificaciones - Portal del estudiante</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/tablet.css" />
  <link rel="stylesheet" href="../css/mobile.css" />
</head>
<body>
  <div class="dashboard-wrapper">
    <div id="sidebar-container" data-sidebar-src="../components/sidebar-alumno.html"></div>
    <main class="dashboard-main">
      <div class="container dashboard-content">
        <div class="mb-3">
          <h3 class="section-title mb-0">Mis calificaciones</h3>
        </div>

        <div class="card">
          <div class="card-header bg-soft-primary">
            <ul class="nav nav-tabs card-header-tabs" id="califAlumnoTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-actual" data-bs-toggle="tab" data-bs-target="#pane-actual" type="button" role="tab" aria-controls="pane-actual" aria-selected="true">
                  Periodo actual
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-historial" data-bs-toggle="tab" data-bs-target="#pane-historial" type="button" role="tab" aria-controls="pane-historial" aria-selected="false">
                  Historial
                </button>
              </li>
            </ul>
          </div>
          <div class="card-body">
            <div class="tab-content">
              <div class="tab-pane fade show active" id="pane-actual" role="tabpanel" aria-labelledby="tab-actual">
                <div id="califAlumnoActualContenedor">
                  <div class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span> Cargando…</div>
                </div>
              </div>

              <div class="tab-pane fade" id="pane-historial" role="tabpanel" aria-labelledby="tab-historial">
                <div class="row g-3 mb-3" id="califAlumnoHistorialTarjetas">
                  <div class="col-12 text-muted small"><span class="spinner-border spinner-border-sm me-2"></span>Cargando historial…</div>
                </div>
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Asignatura</th>
                        <th class="text-nowrap">Calificación</th>
                        <th>Estado</th>
                      </tr>
                    </thead>
                    <tbody id="califAlumnoHistorialBody">
                      <tr><td colspan="3" class="text-center text-muted py-4">Selecciona una tarjeta de periodo.</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/load-sidebar.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/roles.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sistema-roles-unified.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/calificaciones-alumno.js"></script>
</body>
</html>
